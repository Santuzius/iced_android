[package]
name = "iced_android"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Runs iced apps on Android: soft keyboard, text menu, clipboard, system-bar insets, back gesture, system theme and fonts"
repository = "https://github.com/Santuzius/iced_android"
# The Java half is not compiled by Cargo; the app's Gradle build includes it (see README).
include = ["src", "java", "README.md", "LICENSE"]

[dependencies]
# The Android support lives in this fork of iced; apps must use the same fork (see README).
iced_core = { git = "https://github.com/Santuzius/iced", branch = "android-0.14" }
iced_futures = { git = "https://github.com/Santuzius/iced", branch = "android-0.14" }
iced_runtime = { git = "https://github.com/Santuzius/iced", branch = "android-0.14" }

[target.'cfg(target_os = "android")'.dependencies]
iced_widget = { git = "https://github.com/Santuzius/iced", branch = "android-0.14", default-features = false }
iced_winit = { git = "https://github.com/Santuzius/iced", branch = "android-0.14", default-features = false }
jni = "0.21"
log = "0.4"
tokio = { version = "1", features = ["sync"] }
# IcedActivity extends NativeActivity, so winit must use android-activity's NativeActivity backend.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
